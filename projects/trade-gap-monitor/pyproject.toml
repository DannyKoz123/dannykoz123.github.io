[project]
name = "tradegap"
version = "0.1.0"
description = "Mirror-trade gap monitor for dual-use goods rerouted to Russia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
tradegap = "tradegap.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
