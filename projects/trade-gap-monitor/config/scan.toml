# Scan: after Central Asia and Armenia dried up in 2024, which countries
# took over as routes for high-priority dual-use goods into Russia?
#
# Needs a Comtrade API key: responses exceed the keyless 500-row cap.

title = "Trade Gap Monitor: where did dual-use flows to Russia move after 2023?"
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
baseline_years = [2019, 2020, 2021]
cif_fob_factor = 1.06

[suppliers]
CHN = 156
DEU = 276
USA = 842
HKG = 344
TWN = 490  # Comtrade lists Taiwan as "Other Asia, nes"
JPN = 392
KOR = 410
MYS = 458

